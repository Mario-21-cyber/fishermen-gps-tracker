<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin Login — Azagra Fishermen Monitor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-body">
    <div class="login-card">
      <div class="login-brand">
        <span class="login-badge">🚤</span>
        <h1>Fishermen Safety Monitor</h1>
        <p>Barangay Azagra · Sibuyan Island, San Fernando, Romblon</p>
      </div>
      <form id="login-form">
        <label>Username
          <input id="username" autocomplete="username" required />
        </label>
        <label>Password
          <input id="password" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="login-error"></p>
        <button type="submit" id="login-btn">Sign in as admin</button>
      </form>
      <p id="default-hint" class="login-hint" style="display:none">
        ⚠ <b>Default credentials:</b> username <b>admin</b> · password
        <b>admin123</b><br />Mag-sign in at palitan agad ang password sa
        <b>Settings → Admin account</b>.
      </p>
    </div>
    <script src="login.js"></script>
  </body>
</html>
